services:
  # Backend API Service
  - type: web
    name: worker-fatigue-backend
    env: python
    plan: free
    region: oregon
    branch: main

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: python app/main.py

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.10

  # Frontend Static Site
  - type: web
    name: worker-fatigue-frontend
    env: static
    plan: free
    region: oregon
    branch: main

    buildCommand: |
      cd frontend
      npm install
      npm run build

    staticPublishPath: frontend/dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html